<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/init_darkmode.js"></script>
</head>

<body>
  <div id="external-message" class="external-message" style="display: none"></div>

  <div class="login-container forgot-password-container">
    <h2>Reset Password</h2>

    <p class="info-text">
      If your email was connected to your account, enter it here to receive a
      password reset link.
    </p>

    <form id="forgot-form">
      <div class="form-field">
        <input type="email" id="email" name="email" class="input-field" placeholder="Email address" required />
      </div>
      <div id="message" class="error-message"></div>
      <button type="submit" class="btn-login-blue">Send Reset Link</button>
    </form>

    <div class="footer">
      <p><a href="login">Back to Login</a></p>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/darkmode.js"></script>
  <script src="js/forgot-password.js"></script>
</body>

</html>
