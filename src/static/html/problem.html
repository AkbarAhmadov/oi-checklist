<!doctype html>
<html>

<head>
  <title>Problem - OI Checklist</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/init_darkmode.js"></script>
</head>

<body>
  <nav class="navbar" id="navbar">
    <div class="navbar-content">
      <div class="navbar-left">
        <a href="/" class="home-icon">
          <svg class="home-icon-svg" width="36" height="36" viewBox="0 0 24 24" stroke="none">
            <path d="M12 3l9 7v11h-6v-8h-6v8H3V10l9-7z" />
          </svg>
        </a>
        <div class="navbar-title">Problem</div>
      </div>
      <div class="navbar-user">
        <span class="welcome-message" id="welcome-message" style="display: none"></span>
        <a href="#" class="logout-button" id="logout-button" style="display: none">Logout</a>
        <div class="dark-mode-toggle">
          <label class="switch">
            <input type="checkbox" id="dark-mode-switch" />
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </div>
  </nav>

  <div class="problem-page">
    <div id="problem-loading" class="problem-loading-text">Loading...</div>

    <div id="problem-container" style="display: none">
      <div class="problem-page-header">
        <h1 id="problem-name" class="problem-page-name"></h1>
        <div class="problem-page-meta" id="problem-page-meta"></div>
      </div>
      <div class="problem-links-section">
        <h2 class="problem-links-heading">Sources</h2>
        <ul id="problem-links-list" class="problem-links-list"></ul>
      </div>
    </div>

    <div id="problem-not-found" class="problem-not-found" style="display: none">
      <h2>Problem not found</h2>
      <p>No problem was found matching this URL.</p>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/problem.js"></script>
</body>

</html>
