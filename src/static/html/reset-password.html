<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/init_darkmode.js"></script>
</head>

<body>
  <div class="login-container">
    <h2>Set New Password</h2>
    <p style="
          text-align: center;
          margin-bottom: 20px;
          color: #666;
          line-height: 1.5;
        ">
      Enter your new password below.
    </p>

    <form id="reset-form">
      <div class="form-field">
        <input type="password" id="password" name="password" class="input-field" placeholder="New password" required />
      </div>
      <div class="form-field">
        <input type="password" id="confirmPassword" name="confirmPassword" class="input-field"
          placeholder="Confirm new password" required />
      </div>
      <div id="message" class="error-message"></div>
      <button type="submit" class="btn-login-blue">Reset Password</button>
    </form>

    <div class="footer">
      <p><a href="login">Back to Login</a></p>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/darkmode.js"></script>
  <script src="js/reset-password.js"></script>
</body>

</html>
